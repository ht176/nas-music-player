name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            targets: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'NAS Music Player v__VERSION__'
          releaseBody: '全平台发布产物（Windows / macOS Universal / Linux / Android）。'
          releaseDraft: true
          prerelease: false
          args: --ignore-version-mismatches ${{ matrix.args }}

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK: $NDK_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Init Tauri Android target
        env:
          CI: 'true'
        run: pnpm tauri android init

      - name: Build Android APK
        env:
          CI: 'true'
        run: pnpm tauri android build --apk

      - name: Sign APKs with Android Official apksigner
        run: |
          # 1. 查找 Android SDK 原生自带的 build-tools 工具路径
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # 2. 生成标准 Android 签名密钥库
          keytool -genkey -v -keystore release.keystore \
            -storepass android -alias androidkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=NASMusicPlayer,O=Aura,C=CN"

          mkdir -p signed-apks
          RAW_APKS=$(find src-tauri/gen/android -name "*.apk")
          echo "Found generated APKs: $RAW_APKS"

          for apk in $RAW_APKS; do
            filename=$(basename "$apk")
            aligned_apk="signed-apks/aligned-$filename"
            final_apk="signed-apks/${filename/-unsigned/}"
            
            # 字节对齐
            $ZIPALIGN -v -p 4 "$apk" "$aligned_apk"
            # 官方证书签名 (支持 v1 + v2 + v3 签名方案)
            $APKSIGNER sign --ks release.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androidkey \
              --out "$final_apk" \
              "$aligned_apk"
            
            # 验证签名有效性
            $APKSIGNER verify --verbose "$final_apk"
          done

      - name: Collect Android APKs
        run: |
          mkdir -p android-apks
          find signed-apks/ -maxdepth 1 -name "*.apk" ! -name "aligned-*" -exec cp {} android-apks/ \;
          ls -la android-apks

      - name: Upload APKs to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : '';
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
            });
            const draft = releases.data.find(r => r.draft && (!tag || r.tag_name === tag || r.name.includes(tag))) || releases.data.find(r => r.draft);
            if (!draft) {
              console.log('No draft release found to attach APKs.');
              return;
            }
            const apkDir = path.resolve('android-apks');
            if (fs.existsSync(apkDir)) {
              const files = fs.readdirSync(apkDir);
              for (const file of files) {
                if (file.endsWith('.apk')) {
                  const filePath = path.join(apkDir, file);
                  const fileData = fs.readFileSync(filePath);
                  // 净化文件名便于用户识别
                  const cleanName = file.replace('-unsigned', '').replace('-aligned-debugSigned', '').replace('-aligned-signed', '');
                  console.log(`Uploading ${cleanName} (${fileData.length} bytes)...`);
                  await github.rest.repos.uploadReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: draft.id,
                    name: `NAS-Music-Player-${cleanName}`,
                    data: fileData,
                  });
                }
              }
            }

  publish-release:
    needs: [release, release-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Draft Release with Auto Release Notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : '';
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
            });
            const draft = releases.data.find(r => r.draft && (!tag || r.tag_name === tag || r.name.includes(tag))) || releases.data.find(r => r.draft);
            if (draft) {
              let notes = '';
              try {
                const notesRes = await github.rest.repos.generateReleaseNotes({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: draft.tag_name || tag,
                });
                notes = notesRes.data.body || '';
              } catch (e) {
                console.warn('Generate release notes failed:', e.message);
              }

              const bodyContent = [
                '### 🚀 全平台发布产物（Windows / macOS / Linux / Android APK）',
                '安卓用户请下载资产列表中的 `.apk` 文件并在手机上直接点击安装即可。',
                notes ? `\n### 📝 更新日志 (Changelog)\n${notes}` : '',
                '\n---\n*本 Release 由 GitHub Actions 自动化流水线构建并签名签名发布。*'
              ].filter(Boolean).join('\n');

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draft.id,
                draft: false,
                body: bodyContent,
              });
              console.log(`Successfully published release id ${draft.id} (${draft.name}) with notes.`);
            } else {
              console.log('No draft release found to publish.');
            }

