name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'NAS Music Player v__VERSION__'
          releaseBody: '全平台发布产物（Windows / macOS / Linux / Android）。'
          releaseDraft: true
          prerelease: false
          args: --ignore-version-mismatches ${{ matrix.args }}

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | head -n 1)
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using Android NDK: $NDK_PATH"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Init Tauri Android target
        env:
          CI: 'true'
        run: pnpm tauri android init

      - name: Build Android APK
        env:
          CI: 'true'
        run: pnpm tauri android build --apk

      - name: Collect Android APKs
        run: |
          mkdir -p android-apks
          find src-tauri/gen/android -name "*.apk" -exec cp {} android-apks/ \;
          ls -la android-apks

      - name: Upload APKs to Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : '';
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
            });
            const draft = releases.data.find(r => r.draft && (!tag || r.tag_name === tag || r.name.includes(tag))) || releases.data.find(r => r.draft);
            if (!draft) {
              console.log('No draft release found to attach APKs.');
              return;
            }
            const apkDir = path.resolve('android-apks');
            if (fs.existsSync(apkDir)) {
              const files = fs.readdirSync(apkDir);
              for (const file of files) {
                if (file.endsWith('.apk')) {
                  const filePath = path.join(apkDir, file);
                  const fileData = fs.readFileSync(filePath);
                  console.log(`Uploading ${file} (${fileData.length} bytes)...`);
                  await github.rest.repos.uploadReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: draft.id,
                    name: `NAS-Music-Player-${file}`,
                    data: fileData,
                  });
                }
              }
            }

  publish-release:
    needs: [release, release-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Draft Release with Auto Release Notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : '';
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
            });
            const draft = releases.data.find(r => r.draft && (!tag || r.tag_name === tag || r.name.includes(tag))) || releases.data.find(r => r.draft);
            if (draft) {
              let notes = '';
              try {
                const notesRes = await github.rest.repos.generateReleaseNotes({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: draft.tag_name || tag,
                });
                notes = notesRes.data.body || '';
              } catch (e) {
                console.warn('Generate release notes failed:', e.message);
              }

              const bodyContent = [
                '### 🚀 全平台发布产物（Windows / macOS / Linux / Android APK）',
                '安卓用户请下载资产列表中的 `.apk` 文件并在手机上直接点击安装即可。',
                notes ? `\n### 📝 更新日志 (Changelog)\n${notes}` : '',
                '\n---\n*本 Release 由 GitHub Actions 自动化流水线构建并签名签名发布。*'
              ].filter(Boolean).join('\n');

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draft.id,
                draft: false,
                body: bodyContent,
              });
              console.log(`Successfully published release id ${draft.id} (${draft.name}) with notes.`);
            } else {
              console.log('No draft release found to publish.');
            }

