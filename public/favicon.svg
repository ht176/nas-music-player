<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景流光渐变 (深邃极夜黑紫) -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#18232c" />
      <stop offset="55%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#07090d" />
    </radialGradient>

    <!-- 极光翡翠青蓝渐变 (核心品牌色) -->
    <linearGradient id="auroraEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 柔和星光渐变 -->
    <linearGradient id="neonCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 黑胶唱盘质感径向渐变 -->
    <radialGradient id="vinylBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="85%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- 外圈发光滤镜 -->
    <filter id="auroraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 柔和微光 -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <!-- 1. 圆角超质感背景底座 (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- 2. 背景极光弥散雾光 -->
  <circle cx="256" cy="240" r="140" fill="#10b981" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="330" cy="280" r="110" fill="#06b6d4" opacity="0.14" filter="url(#softGlow)" />

  <!-- 3. 黑胶主体外环与发光轨道 (Vinyl Disc) -->
  <g transform="translate(256,256)">
    <!-- 环形外层呼吸光晕 -->
    <circle r="172" fill="none" stroke="url(#auroraEmerald)" stroke-width="3" opacity="0.4" />
    
    <!-- 黑胶唱片主体 -->
    <circle r="162" fill="url(#vinylBody)" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
    
    <!-- 黑胶精密同心音槽纹理 (Grooves) -->
    <circle r="144" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.2" />
    <circle r="128" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    <circle r="112" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
    <circle r="96" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.2" />

    <!-- 4. 环形极光动态律动声波频谱 (环绕唱片周围的辐射光柱) -->
    <!-- 顶部弧形光柱 -->
    <line x1="0" y1="-164" x2="0" y2="-192" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" opacity="0.95" />
    <line x1="-32" y1="-161" x2="-38" y2="-185" stroke="url(#neonCyan)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    <line x1="32" y1="-161" x2="38" y2="-185" stroke="url(#neonCyan)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
    <line x1="-64" y1="-151" x2="-75" y2="-176" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <line x1="64" y1="-151" x2="75" y2="-176" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <line x1="-94" y1="-135" x2="-109" y2="-158" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.65" />
    <line x1="94" y1="-135" x2="109" y2="-158" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.65" />

    <!-- 右侧弧形光柱 -->
    <line x1="164" y1="0" x2="190" y2="0" stroke="url(#auroraEmerald)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="158" y1="-34" x2="182" y2="-40" stroke="url(#auroraEmerald)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <line x1="158" y1="34" x2="182" y2="40" stroke="url(#auroraEmerald)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <line x1="148" y1="68" x2="171" y2="78" stroke="url(#auroraEmerald)" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- 左侧弧形光柱 -->
    <line x1="-164" y1="0" x2="-188" y2="0" stroke="url(#auroraEmerald)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="-158" y1="-34" x2="-182" y2="-40" stroke="url(#auroraEmerald)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <line x1="-158" y1="34" x2="-182" y2="40" stroke="url(#auroraEmerald)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <line x1="-148" y1="68" x2="-171" y2="78" stroke="url(#auroraEmerald)" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- 底部对称弧形光柱 -->
    <line x1="0" y1="164" x2="0" y2="186" stroke="url(#neonCyan)" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <line x1="-32" y1="161" x2="-38" y2="181" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <line x1="32" y1="161" x2="38" y2="181" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" opacity="0.75" />
    <line x1="-64" y1="151" x2="-74" y2="170" stroke="url(#neonCyan)" stroke-width="3.5" stroke-linecap="round" opacity="0.65" />
    <line x1="64" y1="151" x2="74" y2="170" stroke="url(#neonCyan)" stroke-width="3.5" stroke-linecap="round" opacity="0.65" />

    <!-- 5. 唱片中心彩胶 Label (Center Label) -->
    <circle r="72" fill="url(#auroraEmerald)" filter="url(#auroraGlow)" />
    <circle r="68" fill="#09141a" />
    
    <!-- 极光流光弧形 -->
    <circle r="66" fill="url(#auroraEmerald)" opacity="0.85" />
    
    <!-- 6. 核心标志性几何图标：标志性双音浪律动与纯净几何播放三角形 -->
    <!-- 内层黑金轴心 -->
    <circle r="34" fill="#070b10" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- 现代播放微标 (Play Triangle) 偏心居中校正 -->
    <polygon points="-6,-14 -6,14 16,0" fill="#ffffff" />
    <circle cx="0" cy="0" r="3.5" fill="#10b981" />
  </g>
</svg>