[package]
name = "nas-music-player"
version = "1.0.0"
description = "High-Fidelity Cross-Platform NAS Music Player Client"
authors = ["you"]
edition = "2021"

[lib]
name = "nas_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
